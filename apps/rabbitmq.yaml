apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/cloudpirates
      chart: rabbitmq
      targetRevision: 0.21.32
      helm:
        valueFiles:
          - $values/values/rabbitmq.yaml
    - repoURL: https://github.com/hawkish/cluster-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
