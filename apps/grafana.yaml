apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    # The grafana chart moved from grafana/helm-charts to grafana-community in 2026
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.4.1
      helm:
        valueFiles:
          - $values/values/grafana.yaml
    - repoURL: https://github.com/hawkish/cluster-platform.git
      targetRevision: main
      ref: values
    # Dashboard ConfigMaps, built by dashboards/kustomization.yaml
    - repoURL: https://github.com/hawkish/cluster-platform.git
      targetRevision: main
      path: dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The RabbitMQ dashboard ConfigMap is close to client-side apply's 256 KiB
      # last-applied annotation limit
      - ServerSideApply=true
