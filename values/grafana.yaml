# Admin credentials come from the "grafana-admin" Secret, reconciled from sops by
# grafana-admin-password.service in the nix repo (modules/nixos/opt/k3s.nix).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# No PVC: Grafana's state is provisioned from this file, and the admin user is
# re-seeded from the Secret on every start, so a rotated password takes effect
# on the next pod restart.
persistence:
  enabled: false

service:
  type: NodePort
  nodePort: 30300

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: true
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        jsonData:
          # Prometheus' scrape interval (values/prometheus.yaml), so rate() windows fit
          timeInterval: 30s

# Dashboards are JSON files in this repo's dashboards/ directory, turned into
# ConfigMaps labelled grafana_dashboard=1 (see apps/grafana.yaml). The sidecar
# loads them and reloads Grafana when one changes. To save a UI change, export
# the dashboard as JSON, overwrite its file in dashboards/, and push.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    provider:
      # UI edits can't be saved over a file; export them to dashboards/ instead
      allowUiUpdates: false

testFramework:
  enabled: false
