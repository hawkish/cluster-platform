# Admin credentials come from the "grafana-admin" Secret, reconciled from sops by
# grafana-admin-password.service in the nix repo (modules/nixos/opt/k3s.nix).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# No PVC: Grafana's state is provisioned from this file, and the admin user is
# re-seeded from the Secret on every start, so a rotated password takes effect
# on the next pod restart.
persistence:
  enabled: false

service:
  type: NodePort
  nodePort: 30300

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: true
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy

# Dashboards from grafana.com, downloaded by an init container on pod start
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # RabbitMQ's official overview, https://grafana.com/grafana/dashboards/10991
    rabbitmq-overview:
      gnetId: 10991
      revision: 15
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus
    # ArgoCD dashboards from the argo-cd-mixin, https://grafana.com/grafana/dashboards/19993
    argocd-operational-overview:
      gnetId: 19993
      revision: 9
      datasource:
        - name: datasource
          value: prometheus
    # https://grafana.com/grafana/dashboards/19974
    argocd-application-overview:
      gnetId: 19974
      revision: 8
      datasource:
        - name: datasource
          value: prometheus

testFramework:
  enabled: false
