# Single-binary Loki on the local filesystem: one pod, one PVC (k3s local-path).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h # 30 days
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Groups recent lines into templates for pythia's `patterns` tool ("this
  # error appeared 4000 times"). In memory only, for recent data, so it adds
  # no storage. volume_enabled, which pythia's `volume` tool needs, is already
  # on in the chart's default limits_config, and Helm merges ours over it.
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

# Scalable targets off; the chart fails unless these are 0 with filesystem storage
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Clients talk to the loki service on 3100 directly
gateway:
  enabled: false

# Memcached caches default to several GiB of RAM each; not needed at this scale
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false
