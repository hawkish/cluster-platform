# A single Prometheus server that scrapes RabbitMQ (and itself). Everything else
# the chart can install is off; add scrape jobs below as more apps get metrics.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  # 30s, not the chart's 1m: Grafana's $__rate_interval is 4x the data source's
  # timeInterval, and rate() needs at least two samples in that window. Keep this
  # in sync with timeInterval on the Prometheus data source in values/grafana.yaml.
  global:
    scrape_interval: 30s
  retention: 15d
  persistentVolume:
    enabled: true
    size: 10Gi
  # Grafana reaches it in-cluster at http://prometheus-server.monitoring.svc
  service:
    type: ClusterIP

# This chart builds scrape_configs from the scrapeConfigs map, with a set of
# Kubernetes jobs on by default. Keep only its self-scrape and add RabbitMQ.
scrapeConfigs:
  prometheus:
    enabled: true
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

  # RabbitMQ's rabbitmq_prometheus plugin, one target per broker pod.
  # The RabbitMQ-Overview dashboard filters on the namespace label.
  rabbitmq:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [rabbitmq]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: prometheus
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # ArgoCD's components (application controller, server, repo server,
  # applicationset and notifications controllers), each on its "metrics"
  # port. The ArgoCD dashboards filter on cluster and namespace; scraped labels
  # that clash, like argocd_app_info's own namespace, become exported_*.
  argocd:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [argocd]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      # Dex (SSO) isn't configured, so it never opens its metrics port
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: argocd-dex-server
        action: drop
      - target_label: cluster
        replacement: home
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
